<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裸次郎 AR</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script><style>body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px}h1{text-align:center}.choices{display:flex;gap:12px;justify-content:center;margin:16px 0;flex-wrap:wrap}.choices button,.arbtn{font-size:18px;font-weight:700;padding:14px 20px;border:0;border-radius:14px;cursor:pointer}.choices button.active{outline:3px solid #fff}model-viewer{width:100%;height:65vh;min-height:420px;background:#222;border-radius:18px}.note{text-align:center;color:#bbb}</style></head><body><main><h1>裸次郎 AR</h1><div class="choices"><button id="pose" class="active" type="button">通常ポーズ</button><button id="ridicule" type="button">嘲笑モーション</button></div><model-viewer id="viewer" src="hadakajiro_pose.glb" ios-src="hadakajiro_pose.usdz" alt="裸次郎" ar ar-modes="webxr scene-viewer quick-look" camera-controls autoplay><button class="arbtn" slot="ar-button">ARで表示</button></model-viewer><p class="note">動きを選んでから「ARで表示」を押してください。</p></main><script>const v=document.getElementById('viewer'),p=document.getElementById('pose'),r=document.getElementById('ridicule');function s(b,g,u){p.classList.remove('active');r.classList.remove('active');b.classList.add('active');v.src=g;v.setAttribute('ios-src',u)}p.addEventListener('click',()=>s(p,'hadakajiro_pose.glb','hadakajiro_pose.usdz'));r.addEventListener('click',()=>s(r,'Destroyer_SocialMotion_Ridicule.glb','Destroyer_SocialMotion_Ridicule(1).usdz'));</script></body></html>
