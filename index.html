<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>裸次郎 AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:auto;padding:20px}
model-viewer{width:100%;height:68vh;min-height:420px;background:#222;border-radius:18px}
.arbtn{font-size:20px;font-weight:700;padding:16px 24px;border:0;border-radius:14px;cursor:pointer}
p{color:#bbb;text-align:center}
</style>
</head>
<body>
<main>
<model-viewer
 src="hadakajiro_pose.glb"
 ios-src="hadakajiro_pose.usdz"
 alt="裸次郎"
 ar
 ar-modes="webxr scene-viewer quick-look"
 camera-controls
 autoplay>
 <button class="arbtn" slot="ar-button">裸次郎をARで表示</button>
</model-viewer>
<p>ボタンを押すと端末に対応したAR表示を起動します。</p>
</main>
</body>
</html>
